packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

# pnpm 12 exige aprovação explícita de scripts de build (falha no CI com --frozen-lockfile).
allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': true
  esbuild: true
  sharp: false
  unrs-resolver: false
